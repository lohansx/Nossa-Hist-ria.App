<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460E1A"/>
      <stop offset="50%" stop-color="#7A1A2E"/>
      <stop offset="100%" stop-color="#2C060E"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEEF1"/>
      <stop offset="50%" stop-color="#F4CAD3"/>
      <stop offset="100%" stop-color="#E99EAE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fundo Circular Elegante -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Círculo Interno Suave -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(244, 202, 211, 0.25)" stroke-width="4"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(244, 202, 211, 0.12)" stroke-width="2"/>

  <!-- Ícone de Coração em Ouro e Rosa -->
  <path d="M256 420 C256 420, 110 320, 110 200 C110 135, 160 90, 220 90 C245 90, 256 105, 256 105 C256 105, 267 90, 292 90 C352 90, 402 135, 402 200 C402 320, 256 420, 256 420 Z" 
        fill="url(#heartGrad)" 
        filter="url(#glow)"/>

  <!-- Pequeno Brilho -->
  <circle cx="180" cy="150" r="14" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="205" cy="140" r="7" fill="#FFFFFF" opacity="0.5"/>
</svg>
